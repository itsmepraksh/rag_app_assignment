<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI - Advanced RAG Q&A</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">DocuMind AI</div>
            <div class="header-right">
                <div class="session-chip">
                    <span>Session</span>
                    <code id="sessionIdText"></code>
                    <button id="newSessionBtn" class="ghost-btn" type="button">New</button>
                    <button id="resetSessionBtn" class="ghost-btn" type="button">Reset</button>
                </div>
                <div id="status" class="status-pill">System Ready</div>
            </div>
        </header>

        <main class="main-layout">
            <aside class="glass-card">
                <h2 class="section-title">Documents</h2>
                <div class="upload-area" id="dropZone">
                    <p class="upload-hint">Click or drag .pdf / .txt / .md</p>
                    <input type="file" id="fileInput" hidden accept=".pdf,.txt,.md">
                </div>
                <div class="file-list" id="fileList"></div>
            </aside>

            <section class="glass-card chat-container">
                <div class="messages" id="chatMessages">
                    <div class="message bot">
                        Hello! Upload some documents on the left, and I'll help you answer any questions about them.
                    </div>
                </div>
                <details class="debug-panel" id="debugPanel">
                    <summary>Debug Panel</summary>
                    <pre id="debugOutput">No trace yet.</pre>
                </details>
                <div class="input-area">
                    <input type="text" id="userInput" placeholder="Ask something about your docs...">
                    <label class="debug-toggle">
                        <input type="checkbox" id="debugToggle">
                        <span>Debug</span>
                    </label>
                    <button id="sendBtn">Send</button>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
