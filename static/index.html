<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI - Advanced RAG Q&A</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">DocuMind AI</div>
            <div id="status" class="text-muted" style="font-size: 0.875rem;">System Ready</div>
        </header>

        <main class="main-layout">
            <!-- Sidebar: Uploads -->
            <aside class="glass-card">
                <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Documents</h2>
                <div class="upload-area" id="dropZone">
                    <p style="font-size: 0.875rem; color: var(--text-muted);">Click or drag PDF/TXT</p>
                    <input type="file" id="fileInput" hidden accept=".pdf,.txt">
                </div>
                <div class="file-list" id="fileList">
                    <!-- Files will appear here -->
                </div>
            </aside>

            <!-- Main: Chat -->
            <section class="glass-card chat-container">
                <div class="messages" id="chatMessages">
                    <div class="message bot">
                        Hello! Upload some documents on the left, and I'll help you answer any questions about them.
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" id="userInput" placeholder="Ask something about your docs...">
                    <button id="sendBtn">Send</button>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
